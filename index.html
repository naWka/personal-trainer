<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161826">
<meta name="color-scheme" content="dark">
<title>Тренировка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/styles.css?v=4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand-row">
      <div class="brand">
        <span class="brand-name">Тренировка</span>
        <span class="phase" id="phase">загрузка…</span>
      </div>
      <div class="head-meta">
        <span id="head-date"></span>
        <span class="streak" id="head-streak-wrap" hidden><i class="pulse"></i><span id="head-streak"></span></span>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Разделы">
      <a class="tab" href="#today" data-view="today">Сегодня</a>
      <a class="tab" href="#calendar" data-view="calendar">Календарь</a>
      <a class="tab" href="#muscles" data-view="muscles">Мышцы</a>
      <a class="tab" href="#notes" data-view="notes">Заметки</a>
      <a class="tab" href="#library" data-view="library">Справочник</a>
    </nav>
  </div>
</header>

<main>
  <section class="view wrap" id="view-today" aria-label="План на сегодня"><p class="loading">Загрузка…</p></section>
  <section class="view wrap" id="view-calendar" aria-label="Календарь тренировок" hidden><p class="loading">Загрузка…</p></section>
  <section class="view wrap" id="view-muscles" aria-label="Готовность мышечных групп" hidden><p class="loading">Загрузка…</p></section>
  <section class="view wrap" id="view-notes" aria-label="Заметки" hidden><p class="loading">Загрузка…</p></section>
  <section class="view wrap" id="view-library" aria-label="Справочник упражнений" hidden><p class="loading">Загрузка…</p></section>
</main>

<footer class="wrap foot">
  <p>План собирает агент в чате: <code>/workout</code>. Отчёт после зала: <code>/log</code>.</p>
  <p>Не медицинская рекомендация. Стойкая или сильная боль — к врачу.</p>
</footer>

<!-- Техника упражнения: выдвигается поверх экрана, чтобы не уводить из плана. -->
<dialog id="ex-drawer" class="drawer" aria-labelledby="ex-drawer-title">
  <div class="drawer-in" id="ex-drawer-in"></div>
</dialog>

<!-- Расшифровка термина -->
<dialog id="term-modal" class="modal" aria-labelledby="term-modal-title">
  <div class="modal-in" id="term-modal-in"></div>
</dialog>

<script src="assets/app.js?v=4"></script>
</body>
</html>
